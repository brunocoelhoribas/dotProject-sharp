services:
    app:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: dotproject_app
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8080}:8080'
            - '${VITE_PORT:-5173}:5173'
        environment:
            APP_ENV: '${APP_ENV:-local}'
            APP_DEBUG: '${APP_DEBUG:-true}'
            APP_URL: 'http://localhost:${APP_PORT:-8080}'
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: '${DB_DATABASE:-dotproject}'
            DB_USERNAME: '${DB_USERNAME:-root}'
            DB_PASSWORD: '${DB_PASSWORD:-12345}'
            SESSION_DRIVER: '${SESSION_DRIVER:-file}'
            PHP_CLI_SERVER_WORKERS: '${PHP_CLI_SERVER_WORKERS:-4}'
            OPENAI_BASE_URL: '${OPENAI_BASE_URL:-http://ollama:11434/v1}'
            OPENAI_API_KEY: '${OPENAI_API_KEY:-ollama}'
            OLLAMA_MODEL: '${OLLAMA_MODEL:-llama3.2}'
            OPENAI_REQUEST_TIMEOUT: '${OPENAI_REQUEST_TIMEOUT:-180}'
        volumes:
            - '.:/var/www/html'
        depends_on:
            mysql:
                condition: service_healthy
            ollama:
                condition: service_started
        networks:
            - dotproject_network

    mysql:
        image: 'mysql:8.4'
        container_name: dotproject_mysql
        restart: unless-stopped
        ports:
            - '${FORWARD_DB_PORT:-3307}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-12345}'
            MYSQL_DATABASE: '${DB_DATABASE:-dotproject}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
        volumes:
            - 'dotproject_mysql_data:/var/lib/mysql'
            - './database/dump.sql:/docker-entrypoint-initdb.d/01-dump.sql:ro'
        networks:
            - dotproject_network
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p${DB_PASSWORD:-12345} || exit 1']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

    ollama:
        image: 'ollama/ollama:latest'
        container_name: dotproject_ollama
        restart: unless-stopped
        ports:
            - '11434:11434'
        volumes:
            - 'dotproject_ollama_data:/root/.ollama'
        networks:
            - dotproject_network

networks:
    dotproject_network:
        driver: bridge

volumes:
    dotproject_mysql_data:
        driver: local
    dotproject_ollama_data:
        driver: local
